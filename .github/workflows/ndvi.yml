name: AgriSat daily

# Runs in GitHub's cloud every morning (07:00 IST) ‚Äî no computer, browser or person needed.
#   1. unit tests (the model must still reproduce the hand-calculated cases)
#   2. Sentinel-2 NDVI image + status, then the water-balance decision (scripts/run_daily.py)
#   3. commit ndvi_*, data/decision.json, data/state.json, data/log.csv back to the repo
# A failure turns the run red (GitHub emails you); Telegram alerts are sent too if the secrets are set.
on:
  schedule:
    - cron: "30 1 * * *"      # 01:30 UTC = 07:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agrisat-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ndvi.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-ndvi.txt

      - name: Model tests
        run: python tests/test_agrisat_model.py

      - name: Daily job (NDVI + water balance + decision)
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRICT: "1"
        run: python scripts/ndvi_pipeline.py

      - name: Commit results
        if: always()
        run: |
          git config user.name  "agrisat-bot"
          git config user.email "agrisat-bot@users.noreply.github.com"
          git add ndvi_latest.jpeg ndvi_status.json ndvi_archive data || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "AgriSat daily $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
