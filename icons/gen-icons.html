<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AgriSat Icon Generator</title>
<style>
body{font-family:monospace;background:#060a09;color:#00ff41;padding:24px;max-width:480px;margin:0 auto}
h2{letter-spacing:.1em;font-size:14px;margin-bottom:16px;color:#00dbe9}
.btn{background:rgba(0,255,65,.12);border:1px solid rgba(0,255,65,.3);color:#00ff41;padding:10px 20px;cursor:pointer;font-family:monospace;font-size:11px;letter-spacing:.08em;border-radius:6px;display:block;width:100%;margin-bottom:8px}
.btn:hover{background:rgba(0,255,65,.22)}
canvas{display:none}
#status{font-size:11px;color:rgba(185,204,178,.6);margin-top:12px;white-space:pre}
a{color:#00dbe9;display:block;margin:4px 0;font-size:11px}
</style>
</head>
<body>
<h2>TERRA-CORE ICON GENERATOR</h2>
<p style="font-size:11px;color:rgba(185,204,178,.5);margin-bottom:16px">Open this file in a browser to generate PNG icons required for the PWA. Save each downloaded file to the icons/ folder.</p>
<button class="btn" onclick="generateAll()">GENERATE ALL ICONS</button>
<div id="links"></div>
<div id="status">Ready.</div>
<canvas id="c"></canvas>

<script>
const SVG_SRC = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0d1f15"/>
      <stop offset="100%" stop-color="#040908"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <line x1="0" y1="128" x2="512" y2="128" stroke="#00ff41" stroke-width="0.6" opacity="0.07"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#00ff41" stroke-width="0.6" opacity="0.07"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#00ff41" stroke-width="0.6" opacity="0.07"/>
  <line x1="128" y1="0" x2="128" y2="512" stroke="#00ff41" stroke-width="0.6" opacity="0.07"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#00ff41" stroke-width="0.6" opacity="0.07"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="#00ff41" stroke-width="0.6" opacity="0.07"/>
  <ellipse cx="256" cy="230" rx="160" ry="120" fill="url(#glow)"/>
  <ellipse cx="256" cy="210" rx="140" ry="52" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.2" stroke-dasharray="10 7"/>
  <rect x="90" y="188" width="110" height="36" rx="5" fill="#001a0d" stroke="#00dbe9" stroke-width="2" opacity="0.85"/>
  <line x1="107" y1="188" x2="107" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="188" x2="125" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <line x1="143" y1="188" x2="143" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <line x1="161" y1="188" x2="161" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <rect x="200" y="202" width="24" height="8" rx="2" fill="#00ff41" opacity="0.8"/>
  <rect x="218" y="176" width="76" height="60" rx="8" fill="#0d2218" stroke="#00ff41" stroke-width="3"/>
  <rect x="228" y="186" width="56" height="12" rx="3" fill="#00ff41" opacity="0.15"/>
  <circle cx="256" cy="215" r="10" fill="#00ff41" opacity="0.8"/>
  <circle cx="256" cy="215" r="5" fill="#00ff41"/>
  <rect x="288" y="202" width="24" height="8" rx="2" fill="#00ff41" opacity="0.8"/>
  <rect x="312" y="188" width="110" height="36" rx="5" fill="#001a0d" stroke="#00dbe9" stroke-width="2" opacity="0.85"/>
  <line x1="329" y1="188" x2="329" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <line x1="347" y1="188" x2="347" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <line x1="365" y1="188" x2="365" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <line x1="383" y1="188" x2="383" y2="224" stroke="#00dbe9" stroke-width="1" opacity="0.5"/>
  <rect x="208" y="238" width="96" height="10" rx="3" fill="#00ff41" opacity="0.5"/>
  <line x1="220" y1="248" x2="180" y2="330" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.45"/>
  <line x1="256" y1="248" x2="256" y2="330" stroke="#00ff41" stroke-width="2" stroke-dasharray="5 5" opacity="0.55"/>
  <line x1="292" y1="248" x2="332" y2="330" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.45"/>
  <ellipse cx="256" cy="348" rx="110" ry="18" fill="#00ff41" opacity="0.08"/>
  <path d="M146 345 Q190 330 256 345 Q322 330 366 345" fill="none" stroke="#00ff41" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
  <path d="M160 358 Q210 345 256 356 Q302 345 352 358" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <circle cx="210" cy="370" r="5" fill="#00dbe9" opacity="0.75"/>
  <circle cx="256" cy="376" r="6" fill="#00dbe9" opacity="0.75"/>
  <circle cx="302" cy="370" r="5" fill="#00dbe9" opacity="0.75"/>
  <text x="256" y="430" text-anchor="middle" font-family="Courier New,monospace" font-size="36" font-weight="900" letter-spacing="4" fill="#00ff41" opacity="0.95">TERRA</text>
  <text x="256" y="460" text-anchor="middle" font-family="Courier New,monospace" font-size="18" font-weight="700" letter-spacing="12" fill="#00dbe9" opacity="0.6">CORE</text>
</svg>`;

async function svgToCanvas(size) {
  const canvas = document.getElementById('c');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const blob = new Blob([SVG_SRC], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  await new Promise((res,rej) => {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, size, size); res(); };
    img.onerror = rej;
    img.src = url;
  });
  URL.revokeObjectURL(url);
  return canvas;
}

function download(canvas, filename) {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }, 'image/png');
}

async function generateAll() {
  const status = document.getElementById('status');
  const links = document.getElementById('links');
  links.innerHTML = '';
  const icons = [
    {size:192, name:'icon-192.png'},
    {size:512, name:'icon-512.png'},
    {size:512, name:'icon-maskable.png'},
    {size:180, name:'apple-touch-icon.png'},
    {size:32,  name:'favicon-32.png'},
  ];
  for (const ico of icons) {
    status.textContent = `Generating ${ico.name} (${ico.size}×${ico.size})...`;
    try {
      const c = await svgToCanvas(ico.size);
      download(c, ico.name);
      links.innerHTML += `<div style="color:rgba(0,255,65,.7)">✓ ${ico.name} (${ico.size}×${ico.size}) — check Downloads</div>`;
      await new Promise(r => setTimeout(r, 300));
    } catch(e) {
      links.innerHTML += `<div style="color:rgba(255,80,80,.7)">✗ ${ico.name} — ${e.message}</div>`;
    }
  }
  status.textContent = 'Done! Move downloaded files to the icons/ folder.';
}
</script>
</body>
</html>
