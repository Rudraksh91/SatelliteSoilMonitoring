<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSat for Farmers</title>
<meta name="theme-color" content="#0b3d2e">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--btnink:#fff;--bg:#f4f7f2;--card:#fff;--ink:#14231b;--mut:#5a6b61;--line:#dfe7dc;--g:#1b7f4b;--gd:#0b3d2e;--amber:#c27a00;--blue:#1a6fb3;--red:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--btnink:#06281b;--bg:#0e1511;--card:#17211b;--ink:#eaf2ec;--mut:#9db0a4;--line:#27362d;--g:#4cc38a;--gd:#0b3d2e;--amber:#f0b24b;--blue:#6ab3ee;--red:#ff8a80}}
:root[data-theme=dark]{--btnink:#06281b;--bg:#0e1511;--card:#17211b;--ink:#eaf2ec;--mut:#9db0a4;--line:#27362d;--g:#4cc38a;--gd:#0b3d2e;--amber:#f0b24b;--blue:#6ab3ee;--red:#ff8a80}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans Gujarati",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--gd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1 1 auto}header a{color:#bfe9d3;font-size:13px}
.lang{display:flex;gap:4px}.lang button{min-height:32px;padding:4px 10px;font-size:13px;background:transparent;color:#bfe9d3;border:1px solid #3a7a62;border-radius:8px}.lang button.on{background:#bfe9d3;color:#0b3d2e}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;letter-spacing:.02em}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:var(--btnink);font-weight:600;cursor:pointer;min-height:46px}
button.sec{background:transparent;color:var(--g);border:1.5px solid var(--g)}button.warn{background:transparent;color:var(--red);border:1.5px solid var(--red)}
button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
input[type=text],input[type=number],input[type=date],select{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#map,#ndviMapBox,#multiMapBox{position:relative;z-index:0;isolation:isolate}   /* map panes/controls can never paint over the sticky top bar */
#map{height:min(58vh,440px);border-radius:12px;border:1px solid var(--line)}
.big{border-radius:16px;padding:18px;color:#fff;margin:0 0 14px}.big .t{font-size:13px;opacity:.85;letter-spacing:.03em}.big .h{font-size:28px;font-weight:800;margin:4px 0;line-height:1.2}.big .r{font-size:15px;opacity:.95}
.big.go{background:var(--blue)}.big.ok{background:var(--g)}.big.wait{background:#5b6f8a}.big.err{background:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .big.ok{color:#06281b}:root:not([data-theme=light]) .big.go{color:#04223a}}
:root[data-theme=dark] .big.ok{color:#06281b}:root[data-theme=dark] .big.go{color:#04223a}
/* embedded inside the TERRA-CORE dashboard: no duplicate title bar, scrolls inside the frame */
html.embed header{position:static;padding:8px 12px}html.embed header h1,html.embed header>a{display:none}html.embed header .lang{margin-left:auto}
.bar{height:16px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;margin:8px 0}.bar i{position:absolute;inset:0 auto 0 0;background:var(--g)}.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:15px}.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){text-align:right}
.note{font-size:13px;color:var(--mut)}.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#fff3d6;color:#7a4e00}
.list button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:600}.list small{display:block;font-weight:400;color:var(--mut)}
.steps div{font-size:14px;color:var(--mut);padding:2px 0}.steps .done{color:var(--g)}.steps .fail{color:var(--red)}
dialog{border:0;border-radius:16px;max-width:520px;width:calc(100% - 28px);padding:18px;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.55)}
.fc{display:flex;gap:6px;overflow-x:auto}.fc div{flex:0 0 auto;text-align:center;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
#ndviMapBox{height:270px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.leg{height:12px;border-radius:6px;margin:10px 0 2px;background:linear-gradient(90deg,#a50026,#f46d43,#fee08b,#ffffbf,#a6d96a,#1a9850,#006837)}.legl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.idx{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.idx:last-of-type{border-bottom:0}.idx .n{text-align:right;flex:0 0 auto}.big2{font-size:22px;font-weight:800}.idxd{font-size:13px;font-weight:700}.idxd.down{color:var(--amber)}.idxd.up{color:var(--g)}.idxd.flat{color:var(--mut)}p.flag{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#fff3d6;color:#7a4e00;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{min-height:34px;padding:4px 12px;font-size:13px;background:transparent;color:var(--g);border:1.5px solid var(--g)}.chips button.on{background:var(--g);color:var(--btnink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* field list with tick boxes, status chips, overview table */
.frow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}.frow input{width:22px;height:auto;flex:0 0 22px;accent-color:var(--g)}
.frow .list-btn{flex:1 1 auto;margin:0;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.frow .list-btn small{display:block;font-weight:400;color:var(--mut)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}.chip.go{background:var(--blue);color:#fff}.chip.ok{background:var(--g);color:var(--btnink)}.chip.wait{background:#5b6f8a;color:#fff}.chip.set{background:#fff3d6;color:#7a4e00}
table.mt{width:100%;border-collapse:collapse;font-size:14px}table.mt th{font-size:12px;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}table.mt td{padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}table.mt td.n{text-align:right;white-space:nowrap}
.sw2{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#multiMapBox{height:300px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.fld-tip{background:rgba(0,0,0,.55);color:#fff;border:0;box-shadow:none;font-weight:700;font-size:12px;padding:2px 6px}
/* autopilot */
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);margin:10px 0}.chk input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--g)}
.tgl{display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;color:var(--ink);margin:0}.tgl input{width:26px;height:26px;accent-color:var(--g)}
.tl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.tl:last-child{border-bottom:0}.tl .tm{flex:0 0 96px;font-weight:800;font-variant-numeric:tabular-nums}.tl .tm small{display:block;font-weight:400;color:var(--mut)}
.tl .tw{flex:1 1 auto;min-width:0}.tl .tw b{display:block}.tl .tw span{font-size:13px;color:var(--mut)}
.zb{border-bottom:1px solid var(--line);padding:6px 0}.zb:last-child{border-bottom:0}.zr{display:flex;gap:10px;align-items:center;padding:4px 0}.zr.pr input{flex:0 0 38%;width:38%}.zr.pr select{flex:1 1 auto;width:auto}.zr>span{flex:1 1 auto;min-width:0}.zr select{flex:0 0 150px;width:150px}
table.ot td{cursor:default;text-align:center;padding:8px 4px;font-size:13px;white-space:nowrap}table.ot td:first-child{text-align:left;white-space:normal}table.ot th{text-align:center}table.ot th:first-child{text-align:left}
table.ot td.w{color:var(--blue);font-weight:700}table.ot td.r{color:var(--mut)}
#apSt{font-size:14px;margin:10px 0 0}#apSt.good{color:var(--g)}#apSt.bad{color:var(--red)}#apSt.mid{color:var(--amber)}
/* phone / tablet / laptop fit: safe areas, thumb-sized targets, no iOS focus-zoom, visible keyboard focus */
main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media(pointer:coarse),(max-width:767px){
  button,select,input[type=text],input[type=number],input[type=date],input[type=time]{min-height:44px}
  .lang button{min-height:40px;min-width:44px;padding:6px 12px}
  .chips button{min-height:40px;padding:6px 14px}
  .frow input,.chk input{width:26px;height:26px;flex:0 0 26px}
  .tgl input{width:30px;height:30px}
  .zr select{min-height:44px}
  input,select,textarea{font-size:16px}
  input[type=checkbox]{width:24px;height:24px;accent-color:var(--g)}
  header a{padding:12px 6px;display:inline-block}
  label:has(>input[type=checkbox]){display:flex;gap:10px;align-items:center;min-height:44px;color:var(--ink);font-size:15px}
}
@media(hover:hover) and (pointer:fine){button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}}
@media(min-width:900px){main{max-width:860px}}
@media(min-width:1500px){main{max-width:1040px}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 data-i="title">AgriSat · Farmer</h1><div class="lang" id="langBar"></div><a href="index.html" data-i="projectLink">Project dashboard</a></header>
<main>

<section id="v-home">
  <div class="card" id="apHome" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 style="margin:0 0 2px" data-i="apTitle"></h2><span class="note" id="apHomeState"></span></div><button class="sec" id="btnAp" data-i="apOpen" style="flex:0 0 auto"></button></div></div>
  <div class="card"><h2 data-i="myFarms">My fields</h2>
    <p class="note" style="margin-top:0" data-i="pickHint"></p>
    <div id="farmList" class="list"></div>
    <div class="row" id="selRow" style="margin-bottom:8px" hidden><button class="sec" id="btnSelAll" data-i="selectAll"></button><button class="sec" id="btnSelNone" data-i="selectNone"></button></div>
    <button id="btnOpenSel" style="width:100%;margin-bottom:8px" hidden></button>
    <button id="btnAdd" class="sec" style="width:100%" data-i="addFarm">＋ Add a field</button></div>
  <p class="note" data-h="homeNote"></p>
</section>

<section id="v-auto" hidden>
  <div class="row" style="margin-bottom:12px"><button class="sec" id="aBack" data-i="back"></button><button id="aPlan" data-i="apPlanNow"></button></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0" data-i="apSwitch"></h2><label class="tgl"><input type="checkbox" id="apOn"><span id="apOnTxt"></span></label></div>
    <p class="note" data-i="apIntro"></p><p class="note" id="apNoCtl" style="color:var(--amber);margin-bottom:0" hidden></p>
  </div>
  <div id="aLoad" class="card steps" hidden></div>
  <div class="card"><h2 data-i="apToday"></h2><div id="aToday"></div><p class="note" id="aTot" style="margin-bottom:2px"></p><p class="note" id="aLast" style="margin:0"></p></div>
  <div class="card"><h2 data-i="apOutlook"></h2><div style="overflow-x:auto"><table class="mt ot" id="aOut"></table></div><p class="note" data-i="apOutNote" style="margin-bottom:0"></p></div>
  <div class="card"><h2 data-i="apPumpHdr"></h2><div id="aZones"></div><p class="note" id="aUnas" style="color:var(--amber);margin-bottom:0"></p></div>
  <div class="card"><h2 data-i="apRules"></h2>
    <label for="apStart" data-i="apStart"></label><input id="apStart" type="time" step="300" style="width:auto">
    <label class="chk"><input type="checkbox" id="apRain"><span data-i="apRuleRain"></span></label>
    <label class="chk"><input type="checkbox" id="apHeat"><span data-i="apRuleHeat"></span></label>
    <label class="chk"><input type="checkbox" id="apNdvi"><span data-i="apRuleNdvi"></span></label>
    <label class="chk"><input type="checkbox" id="apNotify"><span data-i="apNotify"></span></label></div>
  <div class="card"><h2 data-i="apCtl"></h2><p class="note" style="margin-top:0" data-i="apCtlHelp"></p>
    <label for="apId" data-i="apCtlId"></label><input id="apId" type="text" maxlength="64" autocomplete="off" autocapitalize="none" spellcheck="false">
    <label for="apKey"><span data-i="apCtlKey"></span> <span class="note" id="apKeyNote"></span></label><input id="apKey" type="password" maxlength="128" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="row" style="margin-top:12px"><button class="sec" id="apSave" data-i="apSave"></button><button id="apSend" data-i="apSend"></button></div>
    <p id="apSt" role="status"></p></div>
</section>

<section id="v-edit" hidden>
  <div class="card"><h2 id="editTitle"></h2>
    <p class="note" style="margin-top:0" data-i="editHelp"></p>
    <div id="map"></div>
    <div class="row" style="margin-top:10px">
      <button class="sec" id="btnGps" data-i="myLocation"></button>
      <button class="sec" id="btnUndo" data-i="undo"></button>
      <button class="sec" id="btnClear" data-i="clear"></button>
    </div>
    <label for="placeIn" data-i="findLabel"></label>
    <div class="row" style="flex-wrap:nowrap"><input id="placeIn" type="text" maxlength="200" data-ph="findPh" style="flex:1 1 auto"><button class="sec" id="btnFind" data-i="find" style="flex:0 0 auto"></button></div>
    <label for="stateIn" data-i="stateLabel"></label><select id="stateIn"></select>
    <div id="placeRes" class="list" style="margin-top:8px"></div>
    <div id="areaBox" class="note" style="margin:10px 0 0"></div>
    <label><input type="checkbox" id="pinMode"> <span data-i="pinOnly"></span></label>
    <div id="pinArea" hidden><label for="haIn" data-i="haLabel"></label><input id="haIn" type="number" step="0.01" min="0.02" value="0.5"></div>
    <label for="nameIn" data-i="farmName"></label><input id="nameIn" type="text" maxlength="40" data-ph="farmNamePh">
    <label for="cropIn"><span data-i="cropLabel"></span> <span class="note" data-i="cropHint"></span></label><select id="cropIn"></select>
    <label for="plantIn"><span data-i="plantDate"></span> <span class="note" data-i="plantHint"></span></label><input id="plantIn" type="date">
    <div class="card" style="margin:14px 0 0;background:var(--bg)"><h2 data-i="pumpTitle"></h2>
      <p class="note" style="margin-top:0" data-i="pumpHelp"></p>
      <label for="pumpName" data-i="pumpName"></label><input id="pumpName" type="text" maxlength="40">
      <div class="row" style="flex-wrap:nowrap;align-items:flex-end"><div style="flex:1 1 40%"><label for="pumpVal" data-i="pumpSize"></label><input id="pumpVal" type="number" min="0" step="any" inputmode="decimal" placeholder="3000"></div>
        <div style="flex:1 1 60%"><label for="pumpUnit" data-i="pumpUnit"></label><select id="pumpUnit"></select></div></div>
      <div id="pumpHeadBox" hidden><label for="pumpHead" data-i="pumpHead"></label><input id="pumpHead" type="number" min="1" max="300" step="1" value="20" inputmode="decimal"></div>
      <p class="note" id="pumpEq" style="margin:8px 0 0"></p></div>
    <div class="row" style="margin-top:14px"><button id="btnSave" data-i="save"></button><button class="sec" id="btnCancel" data-i="cancel"></button></div>
    <button class="sec" id="btnSaveMore" data-i="saveMore" style="width:100%;margin-top:8px"></button>
  </div>
</section>

<section id="v-multi" hidden>
  <div class="row" style="margin-bottom:12px"><button class="sec" id="mBack" data-i="back"></button><button class="sec" id="mRefresh" data-i="refresh"></button></div>
  <div id="mLoad" class="card steps" hidden></div>
  <div class="card"><h2 data-i="multiTitle"></h2><div id="multiMapBox"></div>
    <div class="leg"></div><div class="legl"><span>−0.2</span><span>0.3</span><span>0.8</span></div>
    <p class="note" id="multiNote" style="margin-bottom:0"></p></div>
  <div class="card"><div style="overflow-x:auto"><table class="mt" id="multiTable"></table></div><p class="note" id="multiTot" style="margin-bottom:4px"></p><p class="note" data-i="tapRow" style="margin:0"></p></div>
</section>

<section id="v-farm" hidden>
  <div class="row" style="margin-bottom:12px"><button class="sec" id="btnBack" data-i="back"></button><button class="sec" id="btnRefresh" data-i="refresh"></button></div>
  <div id="loadCard" class="card steps" hidden></div>
  <div id="advice"></div>
  <div class="card" id="logCard" hidden><h2 data-i="tell"></h2>
    <div class="row"><button id="btnIrr" data-i="irrigated"></button><button id="btnRain" class="sec" data-i="rained"></button></div>
    <div class="row" style="margin-top:8px"><button id="btnFull" class="sec" data-i="soilFull"></button></div>
    <p class="note" id="logNote"></p></div>
  <div class="card" id="mgmt" hidden><div class="row"><button class="sec" id="btnEdit" data-i="mgmtEdit"></button><button class="warn" id="btnDel" data-i="mgmtDel"></button></div></div>
</section>
</main>

<dialog id="consent">
  <h2 style="margin-top:0" data-i="consentTitle"></h2>
  <p data-h="consent1"></p><p data-h="consent2"></p><p class="note" data-i="consent3"></p>
  <label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px"><input type="checkbox" id="consentChk" style="margin-top:5px"> <span data-i="consentAgree"></span></label>
  <div class="row" style="margin-top:14px"><button id="consentBtn" disabled data-i="cont"></button></div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="farmer/core.js?v=20261121n"></script>
<script src="farmer/i18n.js?v=20261121n"></script>
<script src="farmer/ndvimap.js?v=20261121n"></script>
<script src="farmer/autopilot.js?v=20261121n"></script>
<script src="farmer/link.js?v=20261121n"></script>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
(function(){
'use strict';
if(!window.AgriCore||!window.AgriCore.CROP_CATS||!window.AgriI18n){   // an old cached script met a newer page: reload once, bypassing caches
  if(!sessionStorage.getItem('agrisat_reloaded')){sessionStorage.setItem('agrisat_reloaded','1');location.reload();}
}
const C=window.AgriCore, I=window.AgriI18n, KEY='agrisat_farmer_v1', LKEY='agrisat_farmer_lang';
const $=id=>document.getElementById(id);
const today=()=>new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);   // IST calendar day
// embedded in the dashboard (?embed=1): follow its light/dark theme
if(/[?&]embed=1/.test(location.search)){
  document.documentElement.classList.add('embed');
  try{const pr=window.parent.document.documentElement;
    const sync=()=>{const t=pr.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');};
    sync();new MutationObserver(sync).observe(pr,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
}
let db=load(), lang=pickLang(), view='home', map=null, layer=null, pts=[], markers=[], pin=null, editing=null, busy=false, last=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.farms))return d;}catch(e){}return {consent:null,farms:[],selected:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
function pickLang(){try{const l=localStorage.getItem(LKEY);if(l&&I.dict[l])return l;}catch(e){}return I.detect();}
const T=(k,p)=>I.t(lang,k,p);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>Number(n).toFixed(d);
const thousands=n=>fmt(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function show(v){view=v;['home','edit','farm','multi','auto'].forEach(x=>$('v-'+x).hidden=(x!==v));window.scrollTo(0,0);}

// ── language ──
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=T(e.dataset.i);});

  if(pos){map.setView([pos.coords.latitude,pos.coords.longitude],18);return;}

// coordinates ("21.6277, 73.5903"), or a Google Maps link containing @lat,lng / !3dLAT!4dLNG / ?q=lat,lng
function parseCoords(q){
  let m=/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/.exec(q)||/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(q)||/[?&](?:q|ll|query)=(-?\d{1,2}\.\d+)[, ]+(-?\d{1,3}\.\d+)/.exec(q)||/^\s*(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)\s*$/.exec(q);
  return m?[parseFloat(m[1]),parseFloat(m[2])]:null;
}
const inIndia=(la,ln)=>la>=6&&la<=37.5&&ln>=68&&ln<=98;
// Village names are spelled many ways in India (Vandervala / Vandarvela / Vanderwala). Nominatim needs the exact OpenStreetMap spelling;
// Photon (OpenStreetMap data too) tolerates typos. When both fail we also try the common v/w, a/e and double-vowel swaps.
function spellingVariants(q){
  const out=new Set(),add=v=>{v=v.trim();if(v&&v.toLowerCase()!==q.toLowerCase())out.add(v);};
  add(q.replace(/w/gi,m=>m==='w'?'v':'V'));add(q.replace(/v/gi,m=>m==='v'?'w':'W'));
  add(q.replace(/e/gi,m=>m==='e'?'a':'A'));add(q.replace(/a/gi,m=>m==='a'?'e':'E'));
  add(q.replace(/ee/gi,'i'));add(q.replace(/oo/gi,'u'));add(q.replace(/aa/gi,'a'));
  add(q.replace(/(?:wala|vala)$/i,'wada'));add(q.replace(/(?:wala|vala)$/i,'vada'));add(q.replace(/(?:wada|vada)$/i,'vala'));
  return [...out].slice(0,5);
}
async function photonSearch(text,st){
  const c=map&&map.getZoom()>=6?map.getCenter():null;
  const r=await tfetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(st?text+' '+st:text)}&limit=12&lang=en&bbox=68,6,98,37.5${c?`&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}`:''}`,undefined,15000);
  if(!r.ok)return [];
  const seen=new Set();
  return ((await r.json()).features||[]).map(f=>{const p=f.properties||{},g=f.geometry.coordinates,e=p.extent;
    return {name:p.name||p.city||'',detail:[p.locality||p.city,p.district||p.county,p.state].filter(Boolean).join(', '),lat:g[1],lng:g[0],bb:e?[e[3],e[1],e[0],e[2]]:null,type:p.osm_value,place:p.osm_key==='place',state:p.state||''};})
    .filter(x=>x.name&&inIndia(x.lat,x.lng)&&(!st||!x.state||x.state.toLowerCase().includes(st.toLowerCase())||st.toLowerCase().includes(x.state.toLowerCase())))
    .filter(x=>{const k=x.name+'|'+x.lat.toFixed(2)+'|'+x.lng.toFixed(2);if(seen.has(k))return false;seen.add(k);return true;})
    .sort((a,b)=>(b.place?1:0)-(a.place?1:0));
}
async function findPlace(){
  const q=$('placeIn').value.trim();if(q.length<2)return;
  const box=$('placeRes');
  const xy=parseCoords(q);
  if(xy){if(!inIndia(xy[0],xy[1])){box.innerHTML=`<p class="note">${esc(T('coordOut'))}</p>`;return;}map.setView(xy,19);box.innerHTML='';return;}
  box.innerHTML=`<p class="note">${esc(T('searching'))}</p>`;
  const st=$('stateIn').value,full=st?q+', '+st:q;
  let res=[];
  const nominatim=async text=>{   // OpenStreetMap Nominatim: villages, hamlets, towns, districts all over India (sequential, ≥1 s apart, as its usage policy asks)
    const r=await tfetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(text)}&format=jsonv2&countrycodes=in&limit=8&addressdetails=1&accept-language=${lang==='en'?'en':lang+',en'}`,undefined,15000);
    return r.ok?(await r.json()).map(x=>({name:(x.name||x.display_name.split(',')[0]),detail:x.display_name.split(',').slice(1,5).join(',').trim(),lat:+x.lat,lng:+x.lon,bb:x.boundingbox&&x.boundingbox.map(Number),type:x.type})):[];
  };
  try{
    res=await nominatim(full);
    if(!res.length&&!/,/.test(q)&&/\s/.test(q)){await new Promise(r=>setTimeout(r,1100));res=await nominatim(q.split(/\s+/).join(', ')+(st?', '+st:''));}   // "Rajpipla Narmada" -> "Rajpipla, Narmada"
  }catch(e){res=[];}
  if(!res.length){   // typo-tolerant search (same OpenStreetMap data), then spelling variants
    try{res=await photonSearch(q,st);}catch(e){res=[];}
    if(!res.length){for(const v of spellingVariants(q)){try{res=await photonSearch(v,st);}catch(e){res=[];}if(res.length)break;}}
  }
  if(!res.length){   // fallback geocoder
    const go=async l=>{const r=await tfetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${l}&countryCode=IN&format=json`);if(!r.ok)throw new Error('HTTP '+r.status);return (await r.json()).results||[];};
    try{let g=await go(lang);if(!g.length&&lang!=='en')g=await go('en');res=g.map(r=>({name:r.name,detail:[r.admin3,r.admin2,r.admin1].filter(Boolean).join(', '),lat:r.latitude,lng:r.longitude,type:'place'}));}catch(e){res=[];}
  }
  if(!res.length){box.innerHTML=`<p class="note">${esc(T('noPlace'))}</p>`;return;}
  box.innerHTML=res.map((r,i)=>`<button data-i="${i}">${esc(r.name)}<small>${esc(r.detail)}</small></button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const r=res[+b.dataset.i];
    if(r.bb&&r.bb.length===4&&(r.bb[1]-r.bb[0])>0.0002){map.fitBounds([[r.bb[0],r.bb[2]],[r.bb[1],r.bb[3]]],{maxZoom:17,padding:[20,20]});}
    else map.setView([r.lat,r.lng],17);
    box.innerHTML='';
  });
}

// every network step has a deadline so a stalled connection can never freeze the page
const withTimeout=(p,ms,what)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+' timed out')),ms))]);
const tfetch=(url,o,ms=20000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,Object.assign({},o||{},{signal:c.signal})).finally(()=>clearTimeout(t));};
async function jget(url,tries=3){   // flaky rural networks / rate limits: retry with a short back-off

const wxMem={};   // weather shared by fields in the same ~10 km cell (Open-Meteo's grid) so many fields cost one request
async function fetchWeatherFor(la,ln,force){
  const key=la.toFixed(1)+','+ln.toFixed(1),m=wxMem[key];
  if(!force&&m&&Date.now()-m.at<3*3600e3)return m.p;
  const p=jget(`https://api.open-meteo.com/v1/forecast?latitude=${la.toFixed(4)}&longitude=${ln.toFixed(4)}&daily=precipitation_sum,et0_fao_evapotranspiration&past_days=30&forecast_days=7&timezone=Asia%2FKolkata`)
    .then(w=>({time:w.daily.time,rain:w.daily.precipitation_sum.map(v=>v||0),et0:w.daily.et0_fao_evapotranspiration.map(v=>v||0)}));
  wxMem[key]={at:Date.now(),p};p.catch(()=>{delete wxMem[key];});
  return p;
}
/** Everything one field needs (weather, soil, satellite NDVI) — cached; tick(step,state) lets the caller show progress. */
async function gatherInputs(f,force,tick){
  tick=tick||(()=>{});
  const crop=C.cropParams(f.cropId||'general',f.plantingDate),cache=f.cache||{},now=Date.now();
  let weather=null,soil=cache.soil||null,ndvi=cache.ndvi||[];const warn=[];
  const [la,ln]=C.centroid(f.latlngs);
  if(!force&&cache.weather&&cache.weatherAt&&now-cache.weatherAt<3*3600e3){weather=cache.weather;tick(0,'done');}      // fresh enough: no request at all
  else try{weather=await fetchWeatherFor(la,ln,force);cache.weatherAt=now;tick(0,'done');}catch(e){tick(0,'fail');weather=cache.weather||null;if(weather)warn.push('wWeatherOld');}
  if(!soil||cache.soilZr!==crop.root_depth_m||(now-(cache.soilAt||0))>60*864e5){
    try{soil=await withTimeout(C.fetchSoil(la,ln,crop.root_depth_m,(u,o)=>tfetch(u,o,30000)),35000,'soil');cache.soilAt=now;cache.soilZr=crop.root_depth_m;tick(1,'done');}catch(e){tick(1,'fail');soil=soil||null;if(!soil)warn.push('wSoilFail');}
  }else tick(1,'done');
  if(force||!cache.ndviAt||(now-cache.ndviAt)>24*3600e3||!ndvi.length||ndvi[0].ndmi===undefined){   // old cache without NDMI/NDRE: read once more
    try{const sr=await withTimeout(C.ndviSeries(f.latlngs,window.GeoTIFF,(u,o)=>tfetch(u,o,25000),{days:45,maxScenes:3,minPixels:Math.min(8,Math.max(1,Math.floor(f.areaM2/100/4)))}),75000,'satellite');
        ndvi=sr.map((x,i)=>({date:x.date,ndvi:x.ndvi,ndmi:x.ndmi==null?null:x.ndmi,ndre:x.ndre==null?null:x.ndre,n:x.n,shrunk:x.shrunk,grid:(x.grid&&x.grid.cols*x.grid.rows<=2500)||i===0?x.grid:null}));cache.ndviAt=now;tick(2,'done');}
    catch(e){tick(2,'fail');warn.push('wSatFail');}
  }else tick(2,'done');
  if(weather){Object.assign(cache,{weather,soil,ndvi});f.cache=cache;save();}
  return {weather,soil,ndvi,warn,crop};
}
async function analyseField(f,force,tick){
  const g=await gatherInputs(f,force,tick);
  if(!g.weather)return null;
  const adv=C.advise({today:today(),weather:g.weather,soil:g.soil||undefined,ndvi:g.ndvi,crop:g.crop,start:f.start||undefined,events:f.events,areaM2:f.areaM2,flowLph:f.flowLph});
  f.last={date:today(),decision:adv.decision,litres:adv.litres,hours:adv.hours,ndvi:adv.ndvi,needsSetup:adv.needsSetup};save();
  return {f,adv,weather:g.weather,warn:g.warn};
}
async function refreshFarm(force){
  const f=farm();if(!f||busy)return;busy=true;
  const st=[['stWeather',''],['stSoil',''],['stSat',''],['stAdvice','']];steps(st);
  const r=await analyseField(f,force,(i,state)=>{st[i][1]=state;steps(st);});
  if(!r){busy=false;$('loadCard').hidden=true;$('advice').innerHTML=`<div class="big err"><div class="t">${esc(T('noData'))}</div><div class="h">${esc(T('noNet'))}</div><div class="r">${esc(T('connect'))}</div></div>`;return;}
  st[3][1]='done';steps(st);$('loadCard').hidden=true;
  last={f,a:r.adv,w:r.weather,warn:r.warn};renderAdvice(f,r.adv,r.weather,r.warn);busy=false;
}

// ── autopilot: NDVI + weather -> a daily plan for every field -> sent to the pump controller, which runs it by itself ──
const AP=window.AgriAutopilot, LK=window.AgriLink;
const apCfg=()=>db.autopilot||(db.autopilot={enabled:false,startHour:6,startMinute:0,rainGuard:true,et0Comp:true,ndviBoost:true,notify:false});
const apSettings=()=>{const c=apCfg();return {startHour:c.startHour,startMinute:c.startMinute,rainGuard:c.rainGuard,et0Comp:c.et0Comp,ndviBoost:c.ndviBoost};};
const nowMinIST=()=>{const d=new Date(Date.now()+5.5*3600e3);return d.getUTCHours()*60+d.getUTCMinutes();};
let apState=null,apBusy=false;
function ensureZones(){                                      // first time: valve 1,2,3 in field order (3 valves per controller); the farmer can change it
  const used=new Set(db.farms.filter(f=>f.zone).map(f=>f.zone));let ch=false;
  db.farms.forEach(f=>{if(f.zone===undefined){let z=[1,2,3].find(k=>!used.has(k))||null;f.zone=z;if(z)used.add(z);ch=true;}});
  if(ch)save();
}
function renderApHome(){
  const c=apCfg(),box=$('apHome');if(!box)return;
  box.hidden=!db.farms.length;
  $('apHomeState').textContent=T(c.enabled?'apHomeOn':'apHomeOff');
}

$('aBack').onclick=renderHome;
function apStatus(txt,cls){const e=$('apSt');e.textContent=txt||'';e.className=cls||'';}
function openAuto(){show('auto');ensureZones();renderAuto();if(!apState)runAutopilot(false);}
async function runAutopilot(force,silent){
  if(apBusy||!db.farms.length)return null;
  apBusy=true;ensureZones();
  const fields=db.farms.slice(),res={},state=fields.map(f=>[f.name,'']);
  const el=$('aLoad'),paint=()=>{if(silent)return;el.hidden=false;el.innerHTML=state.map(x=>`<div class="${x[1]}">${x[1]==='done'?'✓':x[1]==='fail'?'✕':'…'} ${esc(T('loadingField',{name:x[0]}))}</div>`).join('');};
  paint();if(!silent)$('aPlan').disabled=true;
  let next=0;const worker=async()=>{while(next<fields.length){const i=next++,f=fields[i];
    try{const r=await analyseField(f,!!force);if(r){res[f.id]=r;state[i][1]='done';}else state[i][1]='fail';}catch(e){state[i][1]='fail';}paint();}};
  await Promise.all([worker(),worker()]);
  el.hidden=true;if(!silent)$('aPlan').disabled=false;
  const t=today(),inputs=fields.filter(f=>res[f.id]).map(f=>{const r=res[f.id],w=r.weather,i=w.time.indexOf(t);
    const rain14=i>0?w.rain.slice(Math.max(0,i-14),i).reduce((a,b)=>a+b,0):0;
    return {id:f.id,name:f.name,crop:f.cropId||'general',areaM2:f.areaM2,flowLph:f.flowLph,zone:f.zone||null,adv:r.adv,ndvi:(f.cache&&f.cache.ndvi)||[],et0Today:i>=0?w.et0[i]:0,rain14,w};});
  const S=apSettings(),plan=AP.plan({today:t,settings:S,fields:inputs}),outlooks={};
  inputs.forEach(x=>{outlooks[x.id]=AP.outlook(x,x.w,S,t,7);});
  apState={plan,outlooks,inputs,sched:AP.buildSchedule(plan,inputs,outlooks,nowMinIST()),at:Date.now(),failed:fields.length-inputs.length};
  apBusy=false;apPersist(apState);
  if(view==='auto')renderAuto();
  apNotify();
  return apState;
}
function apNotify(){
  const c=apCfg();if(!c.notify||!apState||c.notified===today()||!('Notification' in window)||Notification.permission!=='granted')return;
  const sc=apState.plan.schedule;if(!sc.length)return;
  try{new Notification(T('apTitle'),{body:T('apNotifyMsg',{n:sc.length,min:apState.plan.totalMinutes})});c.notified=today();save();}catch(e){}
}
const flagHtml=it=>(it.flags||[]).map(fl=>`<br><i style="color:var(--amber)">⚠ ${esc(fl.key==='ndmiDrop'?T('idxFlagNdmi',{drop:fl.drop}):T('idxFlagPeer',{gap:fl.gap}))}</i>`).join('');
function apRuns(st){                                         // today's runs with the start time the controller will really use
  const p=st.plan,zoneOf={};st.inputs.forEach(x=>{zoneOf[x.id]=x.zone;});
  const todays=st.sched.days[p.date]||[],used=new Set();
  return p.schedule.map(it=>{const k=todays.findIndex((r,j)=>!used.has(j)&&r.zone===zoneOf[it.id]&&Math.abs(r.minutes-it.minutes)<0.01);if(k>=0)used.add(k);
    const start=k>=0?todays[k].start:it.start,sm=+start.slice(0,2)*60+ +start.slice(3);return {it,start,startMin:sm,end:AP.hhmm(sm+it.minutes)};});
}
// the dashboard's Automation page reads today's plan from here (same browser storage)
function apPersist(st){
  const c=apCfg(),runs=apRuns(st),by={};runs.forEach(r=>{by[r.it.id]=r;});
  c.plan={date:st.plan.date,at:st.at,items:st.plan.items.map(i=>{const r=by[i.id],f=db.farms.find(x=>x.id===i.id)||{},inp=st.inputs.find(x=>x.id===i.id)||{};
    const ser=((f.cache&&f.cache.ndvi)||[]).filter(x=>x.ndvi!=null).slice(0,3).map(x=>({date:x.date,ndvi:+x.ndvi.toFixed(3),ndmi:x.ndmi!=null?+x.ndmi.toFixed(3):null,ndre:x.ndre!=null?+x.ndre.toFixed(3):null}));
    return {id:i.id,decision:i.decision,reasonKey:i.reasonKey,rp:i.rp||null,minutes:i.minutes||0,litres:i.litres||0,start:r?r.start:null,startMin:r?r.startMin:null,
      crop:f.cropId||'general',flowLph:f.flowLph||null,ndmi:i.ndmi!=null?+i.ndmi.toFixed(3):null,ndre:i.ndre!=null?+i.ndre.toFixed(3):null,stressIndex:i.stressIndex||'ndvi',flags:i.flags||[],ndvi:i.ndvi!=null?+i.ndvi.toFixed(3):null,kc:i.kc!=null?+i.kc.toFixed(2):null,stress:!!i.stress,
      dr:i.dr!=null?+i.dr.toFixed(1):null,raw:i.raw!=null?+i.raw.toFixed(1):null,taw:i.taw!=null?+i.taw.toFixed(1):null,et0:inp.et0Today!=null?+inp.et0Today.toFixed(1):null,
      ndviSeries:ser,outlook:(st.outlooks[i.id]||[]).map(o=>({date:o.date,irrigate:!!o.irrigate,minutes:o.minutes||0,skipRain:!!o.skipRain,rain:+(o.rain||0).toFixed(1)}))};})};
  save();
}
function renderAuto(){
  const c=apCfg(),ready=LK.ready();
  $('apOn').checked=!!c.enabled;$('apOnTxt').textContent=T(c.enabled?'apOnLbl':'apOffLbl');
  $('apNoCtl').hidden=ready;$('apNoCtl').textContent=T('apNoCtl');
  $('apStart').value=String(c.startHour).padStart(2,'0')+':'+String(c.startMinute).padStart(2,'0');
  $('apRain').checked=!!c.rainGuard;$('apHeat').checked=!!c.et0Comp;$('apNdvi').checked=!!c.ndviBoost;$('apNotify').checked=!!c.notify;
  if(document.activeElement!==$('apId'))$('apId').value=LK.getId();
  $('apKeyNote').textContent=LK.getKey()?T('apCtlKeySet'):'';
  // valves
  $('aZones').innerHTML=db.farms.map((f,i)=>{const p=fieldPump(f);return `<div class="zb" data-f="${f.id}">
    <div class="zr"><span><span class="sw2" style="background:${window.AgriNdviMap.FIELD_COLOURS[i%8]}"></span><b>${esc(f.name)}</b> <small class="note">${fmt(f.areaM2/10000,2)} ha</small></span>
      <select data-z="${f.id}" aria-label="${esc(T('apZone'))}"><option value="">${esc(T('apNoZone'))}</option>${[1,2,3].map(k=>`<option value="${k}"${f.zone===k?' selected':''}>${esc(T('apZone'))} ${k}</option>`).join('')}</select></div>
    <div class="zr pr"><span class="note">${esc(T('apPump'))}</span>
      <input type="number" min="0" step="any" inputmode="decimal" data-pv="${f.id}" value="${p.value||''}" placeholder="3000" aria-label="${esc(T('pumpSize'))}">
      <select data-pu="${f.id}" aria-label="${esc(T('pumpUnit'))}">${unitOptions(p.unit)}</select></div>
    ${p.unit==='hp'?`<div class="zr pr"><span class="note">${esc(T('pumpHead'))}</span><input type="number" min="1" max="300" step="1" inputmode="decimal" data-ph="${f.id}" value="${p.head||20}"></div>`:''}
    <p class="note" data-pn="${f.id}" style="margin:2px 0 6px${f.flowLph?'':';color:var(--amber)'}">${esc(pumpNote(f.flowLph,f.areaM2))}</p></div>`;}).join('');
  $('aZones').querySelectorAll('select[data-z]').forEach(sel=>sel.onchange=()=>{const f=db.farms.find(x=>x.id===sel.dataset.z);f.zone=sel.value?+sel.value:null;save();apReplan();});
  // pump size per field, right next to its valve: same conversion as the field editor
  const pumpChanged=(id,rerender)=>{const f=db.farms.find(x=>x.id===id),q=k=>$('aZones').querySelector(`[data-${k}="${id}"]`);
    const u=q('pu').value,v=parseFloat(q('pv').value)||null,hd=q('ph')?parseFloat(q('ph').value)||20:((f.pump&&f.pump.head)||20);
    f.flowLph=C.pumpFlowLph(v,u,hd);{const nm=(f.pump&&f.pump.name)||'';f.pump=(v||nm||u!=='lph')?{unit:u,value:v||'',head:hd,name:nm}:null;}
    f.cache=f.cache||null;save();
    const n=q('pn');if(n){n.textContent=pumpNote(f.flowLph,f.areaM2);n.style.color=f.flowLph?'':'var(--amber)';}
    clearTimeout(pumpChanged.t);pumpChanged.t=setTimeout(()=>{if(rerender)renderAuto();apReplan();},rerender?0:700);};
  $('aZones').querySelectorAll('input[data-pv],input[data-ph]').forEach(inp=>inp.oninput=()=>pumpChanged(inp.dataset.pv||inp.dataset.ph,false));
  $('aZones').querySelectorAll('select[data-pu]').forEach(sel=>sel.onchange=()=>pumpChanged(sel.dataset.pu,true));
  const st=apState;
  if(!st){$('aToday').innerHTML=`<p class="note" style="margin:0">${esc(db.farms.length?T('apNeedPlan'):T('apNoFields'))}</p>`;$('aTot').textContent='';$('aLast').textContent='';$('aOut').innerHTML='';$('aUnas').textContent='';return;}
  const p=st.plan,runs=apRuns(st);
  const reason=it=>esc(T(it.reasonKey,it.rp||{}));
  const rows=runs.map(r=>`<div class="tl"><div class="tm">${r.start}<small>→ ${r.end}</small></div><div class="tw"><b>${esc(r.it.name)}</b><span>${esc(T('apMin',{n:r.it.minutes}))} · ${thousands(r.it.litres)} L<br>${reason(r.it)}${flagHtml(r.it)}${r.it.capped?`<br><i>${esc(T('apCapped'))}</i>`:''}</span></div></div>`).join('')
   +p.items.filter(i=>!(i.minutes>0)).map(i=>`<div class="tl"><div class="tm">–</div><div class="tw"><b>${esc(i.name)}</b><span>${i.decision==='SETUP'?esc(T('apSetup')):reason(i)}${flagHtml(i)}</span></div></div>`).join('');
  $('aToday').innerHTML=rows||`<p class="note" style="margin:0">${esc(T('apNone'))}</p>`;
  $('aTot').textContent=runs.length?T('apTotals',{n:runs.length,min:p.totalMinutes,litres:thousands(p.totalLitres)}):T('apNone');
  $('aLast').textContent=T('apLast',{time:new Date(st.at).toLocaleTimeString(lang==='hi'?'hi-IN':lang==='gu'?'gu-IN':'en-IN',{hour:'2-digit',minute:'2-digit'})});
  // 7-day outlook
  const loc=lang==='hi'?'hi-IN':lang==='gu'?'gu-IN':'en-IN',dates=[...Array(7)].map((_,d)=>C.addDays(p.date,d));
  $('aOut').innerHTML=`<thead><tr><th></th>${dates.map(d=>`<th>${new Date(d+'T00:00:00').toLocaleDateString(loc,{weekday:'short'})}</th>`).join('')}</tr></thead><tbody>`+
    st.inputs.map(x=>{const o=st.outlooks[x.id]||[];return `<tr><td>${esc(x.name)}</td>${dates.map((d,i)=>{const e=o[i];
      return !e?'<td class="r">·</td>':e.irrigate?`<td class="w">💧${e.minutes||""}</td>`:e.skipRain?'<td class="r">☔</td>':'<td class="r">–</td>';}).join('')}</tr>`;}).join('')+'</tbody>';
  $('aUnas').textContent=st.sched.unassigned.length?T('apUnassigned',{n:st.sched.unassigned.length,names:st.sched.unassigned.join(', ')}):'';
}
function apReplan(){if(apState)runAutopilot(false,true);}     // uses cached weather/satellite: instant, no network
// controller link: send the plan; the Pi's own status tells us whether it really holds it
async function apSendPlan(manual){
  if(!LK.ready()){if(manual)apStatus(T('apNeedCtl'),'bad');return false;}
  if(!apState)await runAutopilot(false,!manual);
  if(!apState)return false;
  if(manual)apStatus(T('apSending'),'mid');
  const since=Date.now(),ok=await LK.send(LK.scheduleCommand(apState.sched));
  if(!ok){apStatus(T('apSendFail'),'bad');return false;}
  const ack=await LK.waitAck(since,12000);
  if(ack){const sc=ack.schedule||{};apStatus(T('apSent',{days:sc.days||0,runs:(sc.today||[]).length,auto:T(ack.auto?'apAutoOn':'apAutoOff')}),'good');}
  else apStatus(T('apNoAck'),'mid');
  return !!ack;
}
$('aPlan').onclick=async()=>{await runAutopilot(true);if(apCfg().enabled&&LK.ready())apSendPlan(false);};
$('apSend').onclick=()=>apSendPlan(true);
$('apSave').onclick=()=>{const id=LK.setId($('apId').value);const k=$('apKey').value.trim();if(k){if(!LK.setKey(k)){apStatus(T('apNeedCtl'),'bad');return;}$('apKey').value='';}
  $('apId').value=id;LK.connect();renderAuto();apStatus(LK.ready()?'✓':T('apNeedCtl'),LK.ready()?'good':'bad');};
$('apOn').onchange=async()=>{
  const c=apCfg(),on=$('apOn').checked;
  if(on&&LK.ready()&&!confirm(T('apConfirmOn'))){$('apOn').checked=false;return;}
  c.enabled=on;save();renderAuto();renderApHome();
  if(on){await runAutopilot(false);if(LK.ready()){await LK.send({auto_mode:true});apSendPlan(true);}}
  else{
    if(LK.ready()){const a=await LK.send({auto_mode:false}),b=await LK.send({schedule:{days:{}}});apStatus(a&&b?T('apOffDone'):T('apSendFail'),a&&b?'good':'bad');}
    else apStatus(T('apOffNoCtl'),'good');
  }
};
['apRain:rainGuard','apHeat:et0Comp','apNdvi:ndviBoost'].forEach(x=>{const [id,k]=x.split(':');$(id).onchange=()=>{apCfg()[k]=$(id).checked;save();apReplan();};});
$('apStart').onchange=()=>{const v=$('apStart').value||'06:00',c=apCfg();c.startHour=+v.slice(0,2);c.startMinute=+v.slice(3,5);save();apReplan();};
$('apNotify').onchange=async()=>{const c=apCfg();c.notify=$('apNotify').checked;
  if(c.notify&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
  if(c.notify&&(!('Notification' in window)||Notification.permission==='denied')){c.notify=false;$('apNotify').checked=false;}save();};
LK.readHash();if(LK.ready())LK.connect();
// when autopilot is ON, every time the app opens it re-plans from the newest NDVI + forecast and refreshes the controller's plan (silently)
if(apCfg().enabled&&db.farms.length&&!needConsent())setTimeout(async()=>{await runAutopilot(false,true);if(LK.ready())apSendPlan(false);},1500);

// the dashboard's Automation tab opens this view (hash on first load, message afterwards)
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;
  if(e.data.agrisat==='openAutopilot'&&db.farms.length&&!needConsent())openAuto();
  else if(e.data.agrisat==='plan'&&db.farms.length&&!needConsent())runAutopilot(!!e.data.force,true);});

// boot
window.AgriApp={openMulti,_map:()=>map,_picked:()=>[...picked],_state:()=>({pts,pin}),db:()=>db,lang:()=>lang,setLang,refreshFarm,renderHome,openFarm,renderAdvice};
applyStatic();
if(location.hash==='#autopilot'&&db.farms.length&&!needConsent())openAuto();
else if(location.hash==='#plan'&&db.farms.length&&!needConsent()){renderHome();runAutopilot(false,true);}   // background: plan for the dashboard's Automation page
else if(db.farms.length===1&&db.selected&&!needConsent())openFarm(db.selected);else renderHome();
})();
</script>
</body>
