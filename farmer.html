<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSat for Farmers</title>
<meta name="theme-color" content="#0b3d2e">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--btnink:#fff;--bg:#f4f7f2;--card:#fff;--ink:#14231b;--mut:#5a6b61;--line:#dfe7dc;--g:#1b7f4b;--gd:#0b3d2e;--amber:#c27a00;--blue:#1a6fb3;--red:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--btnink:#06281b;--bg:#0e1511;--card:#17211b;--ink:#eaf2ec;--mut:#9db0a4;--line:#27362d;--g:#4cc38a;--gd:#0b3d2e;--amber:#f0b24b;--blue:#6ab3ee;--red:#ff8a80}}
:root[data-theme=dark]{--btnink:#06281b;--bg:#0e1511;--card:#17211b;--ink:#eaf2ec;--mut:#9db0a4;--line:#27362d;--g:#4cc38a;--gd:#0b3d2e;--amber:#f0b24b;--blue:#6ab3ee;--red:#ff8a80}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans Gujarati",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--gd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1 1 auto}header a{color:#bfe9d3;font-size:13px}
.lang{display:flex;gap:4px}.lang button{min-height:32px;padding:4px 10px;font-size:13px;background:transparent;color:#bfe9d3;border:1px solid #3a7a62;border-radius:8px}.lang button.on{background:#bfe9d3;color:#0b3d2e}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;letter-spacing:.02em}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:var(--btnink);font-weight:600;cursor:pointer;min-height:46px}
button.sec{background:transparent;color:var(--g);border:1.5px solid var(--g)}button.warn{background:transparent;color:var(--red);border:1.5px solid var(--red)}
button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
input[type=text],input[type=number],input[type=date],select{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#map{height:min(58vh,440px);border-radius:12px;border:1px solid var(--line)}
.big{border-radius:16px;padding:18px;color:#fff;margin:0 0 14px}.big .t{font-size:13px;opacity:.85;letter-spacing:.03em}.big .h{font-size:28px;font-weight:800;margin:4px 0;line-height:1.2}.big .r{font-size:15px;opacity:.95}
.big.go{background:var(--blue)}.big.ok{background:var(--g)}.big.wait{background:#5b6f8a}.big.err{background:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .big.ok{color:#06281b}:root:not([data-theme=light]) .big.go{color:#04223a}}
:root[data-theme=dark] .big.ok{color:#06281b}:root[data-theme=dark] .big.go{color:#04223a}
/* embedded inside the TERRA-CORE dashboard: no duplicate title bar, scrolls inside the frame */
html.embed header{position:static;padding:8px 12px}html.embed header h1,html.embed header>a{display:none}html.embed header .lang{margin-left:auto}
.bar{height:16px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;margin:8px 0}.bar i{position:absolute;inset:0 auto 0 0;background:var(--g)}.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:15px}.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){text-align:right}
.note{font-size:13px;color:var(--mut)}.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#fff3d6;color:#7a4e00}
.list button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:600}.list small{display:block;font-weight:400;color:var(--mut)}
.steps div{font-size:14px;color:var(--mut);padding:2px 0}.steps .done{color:var(--g)}.steps .fail{color:var(--red)}
dialog{border:0;border-radius:16px;max-width:520px;width:calc(100% - 28px);padding:18px;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.55)}
.fc{display:flex;gap:6px;overflow-x:auto}.fc div{flex:0 0 auto;text-align:center;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
#ndviMapBox{height:270px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.leg{height:12px;border-radius:6px;margin:10px 0 2px;background:linear-gradient(90deg,#a50026,#f46d43,#fee08b,#ffffbf,#a6d96a,#1a9850,#006837)}.legl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{min-height:34px;padding:4px 12px;font-size:13px;background:transparent;color:var(--g);border:1.5px solid var(--g)}.chips button.on{background:var(--g);color:var(--btnink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 data-i="title">AgriSat · Farmer</h1><div class="lang" id="langBar"></div><a href="index.html" data-i="projectLink">Project dashboard</a></header>
<main>

<section id="v-home">
  <div class="card"><h2 data-i="myFarms">My farms</h2><div id="farmList" class="list"></div>
    <button id="btnAdd" style="width:100%" data-i="addFarm">＋ Add my farm</button></div>
  <p class="note" data-h="homeNote"></p>
</section>

<section id="v-edit" hidden>
  <div class="card"><h2 id="editTitle"></h2>
    <p class="note" style="margin-top:0" data-i="editHelp"></p>
    <div id="map"></div>
    <div class="row" style="margin-top:10px">
      <button class="sec" id="btnGps" data-i="myLocation"></button>
      <button class="sec" id="btnUndo" data-i="undo"></button>
      <button class="sec" id="btnClear" data-i="clear"></button>
    </div>
    <label for="placeIn" data-i="findLabel"></label>
    <div class="row" style="flex-wrap:nowrap"><input id="placeIn" type="text" maxlength="60" data-ph="findPh" style="flex:1 1 auto"><button class="sec" id="btnFind" data-i="find" style="flex:0 0 auto"></button></div>
    <div id="placeRes" class="list" style="margin-top:8px"></div>
    <div id="areaBox" class="note" style="margin:10px 0 0"></div>
    <label><input type="checkbox" id="pinMode"> <span data-i="pinOnly"></span></label>
    <div id="pinArea" hidden><label for="haIn" data-i="haLabel"></label><input id="haIn" type="number" step="0.01" min="0.02" value="0.5"></div>
    <label for="nameIn" data-i="farmName"></label><input id="nameIn" type="text" maxlength="40" data-ph="farmNamePh">
    <label for="cropIn"><span data-i="cropLabel"></span> <span class="note" data-i="cropHint"></span></label><select id="cropIn"></select>
    <label for="plantIn"><span data-i="plantDate"></span> <span class="note" data-i="plantHint"></span></label><input id="plantIn" type="date">
    <label for="flowIn"><span data-i="flowLabel"></span> <span class="note" data-i="flowOpt"></span></label><input id="flowIn" type="number" min="0" step="10" placeholder="3000">
    <div class="row" style="margin-top:14px"><button id="btnSave" data-i="save"></button><button class="sec" id="btnCancel" data-i="cancel"></button></div>
  </div>
</section>

<section id="v-farm" hidden>
  <div class="row" style="margin-bottom:12px"><button class="sec" id="btnBack" data-i="back"></button><button class="sec" id="btnRefresh" data-i="refresh"></button></div>
  <div id="loadCard" class="card steps" hidden></div>
  <div id="advice"></div>
  <div class="card" id="logCard" hidden><h2 data-i="tell"></h2>
    <div class="row"><button id="btnIrr" data-i="irrigated"></button><button id="btnRain" class="sec" data-i="rained"></button></div>
    <div class="row" style="margin-top:8px"><button id="btnFull" class="sec" data-i="soilFull"></button></div>
    <p class="note" id="logNote"></p></div>
  <div class="card" id="mgmt" hidden><div class="row"><button class="sec" id="btnEdit" data-i="mgmtEdit"></button><button class="warn" id="btnDel" data-i="mgmtDel"></button></div></div>
</section>
</main>

<dialog id="consent">
  <h2 style="margin-top:0" data-i="consentTitle"></h2>
  <p data-h="consent1"></p><p data-h="consent2"></p><p class="note" data-i="consent3"></p>
  <label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px"><input type="checkbox" id="consentChk" style="margin-top:5px"> <span data-i="consentAgree"></span></label>
  <div class="row" style="margin-top:14px"><button id="consentBtn" disabled data-i="cont"></button></div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="farmer/core.js?v=20261120g"></script>
<script src="farmer/i18n.js?v=20261120g"></script>
<script src="farmer/ndvimap.js?v=20261120g"></script>
<script>
(function(){
'use strict';
if(!window.AgriCore||!window.AgriCore.CROPS||!window.AgriI18n){   // an old cached script met a newer page: reload once, bypassing caches
  if(!sessionStorage.getItem('agrisat_reloaded')){sessionStorage.setItem('agrisat_reloaded','1');location.reload();}
}
const C=window.AgriCore, I=window.AgriI18n, KEY='agrisat_farmer_v1', LKEY='agrisat_farmer_lang';
const $=id=>document.getElementById(id);
const today=()=>new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);   // IST calendar day
// embedded in the dashboard (?embed=1): follow its light/dark theme
if(/[?&]embed=1/.test(location.search)){
  document.documentElement.classList.add('embed');
  try{const pr=window.parent.document.documentElement;
    const sync=()=>{const t=pr.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');};
    sync();new MutationObserver(sync).observe(pr,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
}
let db=load(), lang=pickLang(), view='home', map=null, layer=null, pts=[], markers=[], pin=null, editing=null, busy=false, last=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.farms))return d;}catch(e){}return {consent:null,farms:[],selected:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
function pickLang(){try{const l=localStorage.getItem(LKEY);if(l&&I.dict[l])return l;}catch(e){}return I.detect();}
const T=(k,p)=>I.t(lang,k,p);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>Number(n).toFixed(d);
const thousands=n=>fmt(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function show(v){view=v;['home','edit','farm'].forEach(x=>$('v-'+x).hidden=(x!==v));window.scrollTo(0,0);}

// ── language ──
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=T(e.dataset.i);});
  document.querySelectorAll('[data-h]').forEach(e=>{e.innerHTML=T(e.dataset.h);});
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=T(e.dataset.ph);});
  document.title=T('title');
  const bar=$('langBar');bar.innerHTML=I.langs.map(l=>`<button data-l="${l[0]}" class="${l[0]===lang?'on':''}">${l[1]}</button>`).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  const sel=$('cropIn'),cur=sel.value||(editing&&editing.cropId)||'general';
  sel.innerHTML=Object.keys(C.CROPS).map(k=>`<option value="${k}">${esc(T('crop_'+k))}</option>`).join('');sel.value=cur;
  $('editTitle').textContent=editing?T('editFarm'):T('selectFarm');
}
function setLang(l){lang=l;try{localStorage.setItem(LKEY,l);}catch(e){}applyStatic();
  if(view==='home')renderHome();else if(view==='edit')redraw();else if(view==='farm'&&last)renderAdvice(last.f,last.a,last.w,last.warn);}

// ── consent (P3) ──
const needConsent=()=>!db.consent;
function askConsent(){const d=$('consent');if(d.showModal)d.showModal();else d.setAttribute('open','');}
$('consentChk').onchange=()=>{$('consentBtn').disabled=!$('consentChk').checked;};
$('consentBtn').onclick=()=>{db.consent={at:new Date().toISOString(),v:1};save();$('consent').close&&$('consent').close();$('consent').removeAttribute('open');};

// ── home ──
function renderHome(){
  const el=$('farmList');
  el.innerHTML=db.farms.length?db.farms.map(f=>`<button data-id="${f.id}">${esc(f.name)}<small>${fmt(f.areaM2/10000,2)} ha · ${esc(T('crop_'+(f.cropId||'general')))}</small></button>`).join(''):`<p class="note">${esc(T('noFarm'))}</p>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>openFarm(b.dataset.id));
  show('home');
}
$('btnAdd').onclick=()=>{if(needConsent())return askConsent();startEdit(null);};

// ── map / edit (P4: area, small-farm warning) ──
function ensureMap(center){
  if(map)return;
  map=L.map('map',{zoomControl:true}).setView(center||[22.5,79],center?17:5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(map);
  map.on('click',e=>{if($('pinMode').checked){pin=[e.latlng.lat,e.latlng.lng];}else{pts.push([e.latlng.lat,e.latlng.lng]);}redraw();});
}
function currentShape(){
  if($('pinMode').checked&&pin)return C.squareFromArea(pin[0],pin[1],Math.max(0.02,parseFloat($('haIn').value)||0.5));
  return pts.length>=3?pts.slice():null;
}
function redraw(){
  if(!map)return;
  if(layer){map.removeLayer(layer);layer=null;}markers.forEach(m=>map.removeLayer(m));markers=[];
  const shape=currentShape();
  if($('pinMode').checked&&pin)markers.push(L.marker(pin).addTo(map));
  else pts.forEach(p=>markers.push(L.circleMarker(p,{radius:7,color:'#fff',weight:2,fillColor:'#1b7f4b',fillOpacity:1}).addTo(map)));
  const line=shape||(pts.length>=2?pts:null);
  if(shape)layer=L.polygon(shape,{color:'#ffd54a',weight:3,fillOpacity:.15}).addTo(map);else if(line)layer=L.polyline(line,{color:'#ffd54a',weight:3}).addTo(map);
  const box=$('areaBox');
  if(shape){
    const a=C.polygonAreaM2(shape),ha=a/10000;
    let msg=T('area',{ha:fmt(ha,2),m2:thousands(a)});
    if(ha<0.1)msg+=`<br><span style="color:var(--red)">${esc(T('smallVery'))}</span>`;else if(ha<0.2)msg+=`<br><span style="color:var(--amber)">${esc(T('smallSome'))}</span>`;
    box.innerHTML=msg;
  }else box.textContent=$('pinMode').checked?T('tapCentre'):T('corners',{n:pts.length});
}
function startEdit(f){
  editing=f;pts=f&&!f.pinOnly?f.latlngs.slice():[];pin=f&&f.pinOnly?f.pin:null;
  $('nameIn').value=f?f.name:'';$('flowIn').value=f&&f.flowLph?f.flowLph:'';$('plantIn').value=f&&f.plantingDate?f.plantingDate:'';
  $('cropIn').value=f&&f.cropId?f.cropId:'general';
  $('pinMode').checked=!!(f&&f.pinOnly);$('pinArea').hidden=!$('pinMode').checked;$('haIn').value=f&&f.pinOnly?fmt(f.areaM2/10000,2):'0.5';
  applyStatic();show('edit');
  ensureMap(f?C.centroid(f.latlngs):null);
  setTimeout(()=>{map.invalidateSize();if(f)map.fitBounds(L.latLngBounds(f.latlngs).pad(.3));redraw();},60);
}
$('pinMode').onchange=()=>{$('pinArea').hidden=!$('pinMode').checked;redraw();};
$('haIn').oninput=redraw;
$('btnUndo').onclick=()=>{pts.pop();redraw();};
$('btnClear').onclick=()=>{pts=[];pin=null;redraw();};
$('btnCancel').onclick=renderHome;
// ── "My location": gentle first (network/Wi-Fi fix works indoors), then GPS; clear message per failure; place search as a fallback ──
function locate(highAccuracy){
  return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:highAccuracy,timeout:highAccuracy?20000:10000,maximumAge:300000}));
}
$('btnGps').onclick=async()=>{
  if(!navigator.geolocation){alert(T('alertNoGps'));$('placeIn').focus();return;}
  let pos=null,err=null;
  try{pos=await locate(false);}catch(e1){err=e1;if(e1.code!==1){try{pos=await locate(true);err=null;}catch(e2){err=e2;}}}
  if(pos){map.setView([pos.coords.latitude,pos.coords.longitude],18);return;}
  alert(T(err&&err.code===1?'gpsDenied':err&&err.code===3?'gpsTimeout':'gpsOff'));
  $('placeIn').focus();
};
async function findPlace(){
  const q=$('placeIn').value.trim();if(q.length<2)return;
  const box=$('placeRes');box.innerHTML=`<p class="note">${esc(T('searching'))}</p>`;
  const go=async l=>{const r=await tfetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${l}&countryCode=IN&format=json`);if(!r.ok)throw new Error('HTTP '+r.status);return (await r.json()).results||[];};
  let res=[];
  try{res=await go(lang);if(!res.length&&lang!=='en')res=await go('en');}catch(e){res=[];}
  if(!res.length){box.innerHTML=`<p class="note">${esc(T('noPlace'))}</p>`;return;}
  box.innerHTML=res.map((r,i)=>`<button data-i="${i}">${esc(r.name)}<small>${esc([r.admin3,r.admin2,r.admin1].filter(Boolean).join(', '))}</small></button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=res[+b.dataset.i];map.setView([r.latitude,r.longitude],16);box.innerHTML='';});
}
$('btnFind').onclick=findPlace;
$('placeIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();findPlace();}};
$('btnSave').onclick=()=>{
  const shape=currentShape();
  if(!shape)return alert(T('alertCorners'));
  const area=C.polygonAreaM2(shape);
  if(area<200)return alert(T('alertSmall'));
  const f=editing||{id:'f'+Date.now().toString(36),events:[],cache:null,start:null};
  f.name=($('nameIn').value||T('defaultName')).trim();f.latlngs=shape;f.areaM2=area;f.pinOnly=$('pinMode').checked;f.pin=f.pinOnly?pin:null;
  f.flowLph=parseFloat($('flowIn').value)||null;f.cropId=$('cropIn').value||'general';f.plantingDate=$('plantIn').value||null;
  f.cache=null;                                                              // geometry/crop changed -> drop cached satellite & soil
  if(!editing)db.farms.push(f);db.selected=f.id;save();openFarm(f.id);
};

// ── farm view ──
const farm=()=>db.farms.find(f=>f.id===db.selected);
function openFarm(id){db.selected=id;save();show('farm');$('advice').innerHTML='';last=null;ndviIdx=0;refreshFarm(false);}
$('btnBack').onclick=renderHome;
$('btnRefresh').onclick=()=>refreshFarm(true);
$('btnEdit').onclick=()=>startEdit(farm());
$('btnDel').onclick=()=>{if(confirm(T('cDel'))){db.farms=db.farms.filter(f=>f.id!==db.selected);db.selected=null;save();renderHome();}};

function steps(list){const el=$('loadCard');el.hidden=false;el.innerHTML=list.map(s=>`<div class="${s[1]||''}">${s[1]==='done'?'✓':s[1]==='fail'?'✕':'…'} ${esc(T(s[0]))}</div>`).join('');}
// every network step has a deadline so a stalled connection can never freeze the page
const withTimeout=(p,ms,what)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+' timed out')),ms))]);
const tfetch=(url,o,ms=20000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,Object.assign({},o||{},{signal:c.signal})).finally(()=>clearTimeout(t));};
async function jget(url,tries=3){   // flaky rural networks / rate limits: retry with a short back-off
  let err;for(let i=0;i<tries;i++){try{const r=await tfetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}catch(e){err=e;await new Promise(r=>setTimeout(r,800*(i+1)));}}
  throw err;
}

async function refreshFarm(force){
  const f=farm();if(!f||busy)return;busy=true;
  const st=[['stWeather',''],['stSoil',''],['stSat',''],['stAdvice','']];steps(st);
  const crop=C.cropParams(f.cropId||'general',f.plantingDate);
  const cache=f.cache||{};const now=Date.now();let weather=null,soil=cache.soil||null,ndvi=cache.ndvi||[],warn=[];
  const [la,ln]=C.centroid(f.latlngs);
  try{
    const w=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${la.toFixed(4)}&longitude=${ln.toFixed(4)}&daily=precipitation_sum,et0_fao_evapotranspiration&past_days=30&forecast_days=7&timezone=Asia%2FKolkata`);
    weather={time:w.daily.time,rain:w.daily.precipitation_sum.map(v=>v||0),et0:w.daily.et0_fao_evapotranspiration.map(v=>v||0)};
    st[0][1]='done';
  }catch(e){st[0][1]='fail';weather=cache.weather||null;if(weather)warn.push('wWeatherOld');}
  steps(st);
  if(!soil||cache.soilZr!==crop.root_depth_m||(now-(cache.soilAt||0))>60*864e5){
    try{soil=await withTimeout(C.fetchSoil(la,ln,crop.root_depth_m,(u,o)=>tfetch(u,o,30000)),35000,'soil');cache.soilAt=now;cache.soilZr=crop.root_depth_m;st[1][1]='done';}catch(e){st[1][1]='fail';soil=soil||null;warn.push('wSoilFail');}
  }else st[1][1]='done';
  steps(st);
  if(force||!cache.ndviAt||(now-cache.ndviAt)>24*3600e3||!ndvi.length){
    try{const s=await withTimeout(C.ndviSeries(f.latlngs,window.GeoTIFF,(u,o)=>tfetch(u,o,25000),{days:45,maxScenes:3,minPixels:Math.min(8,Math.max(1,Math.floor(f.areaM2/100/4)))}),75000,'satellite');
        ndvi=s.map((x,i)=>({date:x.date,ndvi:x.ndvi,n:x.n,shrunk:x.shrunk,grid:(x.grid&&x.grid.cols*x.grid.rows<=2500)||i===0?x.grid:null}));cache.ndviAt=now;st[2][1]='done';}
    catch(e){st[2][1]='fail';warn.push('wSatFail');}
  }else st[2][1]='done';
  steps(st);
  if(!weather){busy=false;$('loadCard').hidden=true;$('advice').innerHTML=`<div class="big err"><div class="t">${esc(T('noData'))}</div><div class="h">${esc(T('noNet'))}</div><div class="r">${esc(T('connect'))}</div></div>`;return;}
  Object.assign(cache,{weather,soil,ndvi});f.cache=cache;save();
  st[3][1]='done';steps(st);$('loadCard').hidden=true;
  const adv=C.advise({today:today(),weather,soil:soil||undefined,ndvi,crop,start:f.start||undefined,events:f.events,areaM2:f.areaM2,flowLph:f.flowLph});
  last={f,a:adv,w:weather,warn};renderAdvice(f,adv,weather,warn);busy=false;
}

// ── NDVI map of THIS farm: one coloured square per 10 m pixel inside the outline (same RdYlGn scale as the dashboard, -0.2..0.8) ──
let ndviIdx=0;
function drawNdvi(f){
  const box=$('ndviMapBox');if(!box)return;
  const r=window.AgriNdviMap.render(box,f,ndviIdx,L,C);
  if(!r.scene){box.style.display='none';$('ndviNote').textContent=T('ndviNone');$('ndviDates').innerHTML='';return;}
  $('ndviDates').innerHTML=r.scenes.map((x,i)=>`<button data-k="${i}" class="${x===r.scene?'on':''}">${esc(x.date)}</button>`).join('');
  $('ndviDates').querySelectorAll('button').forEach(b=>b.onclick=()=>{ndviIdx=+b.dataset.k;drawNdvi(f);});
  $('ndviNote').textContent=T('ndviMean',{v:fmt(r.scene.ndvi,2),date:r.scene.date});
}

function renderAdvice(f,a,w,warn){
  const warnHtml=warn.length?`<div class="card"><p class="note" style="margin:0;color:var(--amber)">${warn.map(k=>esc(T(k))).join('<br>')}</p></div>`:'';
  if(a.needsSetup){   // never give a confident litres figure from an assumed starting state
    $('advice').innerHTML=
     `<div class="big wait"><div class="t">${esc(f.name)} · ${fmt(f.areaM2/10000,2)} ha</div><div class="h">${esc(T('oneQ'))}</div>
       <div class="r">${esc(T('soilQ'))}</div>
       <div class="row" style="margin-top:12px"><button data-soil="0.1" style="background:#fff;color:#14231b">${esc(T('wet'))}</button><button data-soil="0.5" style="background:#fff;color:#14231b">${esc(T('moist'))}</button><button data-soil="1.2" style="background:#fff;color:#14231b">${esc(T('dry'))}</button></div></div>`+warnHtml;
    $('advice').querySelectorAll('[data-soil]').forEach(b=>b.onclick=()=>{const fm=farm();fm.start={date:today(),fracRaw:parseFloat(b.dataset.soil)};save();refreshFarm(false);});
    $('logCard').hidden=true;$('mgmt').hidden=false;return;
  }
  const cls={IRRIGATE:'go',OK:'ok',WAIT_RAIN:'wait'}[a.decision]||'ok';
  const head=T({IRRIGATE:'hIrrigate',OK:'hOk',WAIT_RAIN:'hWait'}[a.decision]);
  let how='';
  if(a.decision==='IRRIGATE'){
    const time=a.hours?(a.hours<1?T('tMin',{n:fmt(a.hours*60)}):T('tHour',{n:fmt(a.hours,1)})):null;
    how=`<div class="r" style="margin-top:8px">${T('apply',{mm:fmt(a.grossMm),litres:thousands(a.litres)})}${time?T('applyHours',{time,flow:f.flowLph}):''}.</div>`;
  }else if(a.decision==='OK'){how=`<div class="r" style="margin-top:8px">${esc(a.daysLeft<1?T('checkDay'):T('checkAgain',{n:fmt(a.daysLeft)}))}</div>`;}
  const dates=w.time,i0=Math.max(0,dates.indexOf(today()));
  const loc=lang==='hi'?'hi-IN':lang==='gu'?'gu-IN':'en-IN';
  const fc=dates.slice(i0,i0+5).map((d,i)=>{const k=i0+i;return `<div><b>${new Date(d+'T00:00:00').toLocaleDateString(loc,{weekday:'short'})}</b><br>${fmt(w.rain[k],0)} mm<br><span class="note">${esc(T('et'))} ${fmt(w.et0[k],1)}</span></div>`;}).join('');
  const nd=(f.cache&&f.cache.ndvi&&f.cache.ndvi[0])||null;
  const crop=C.cropParams(f.cropId||'general',f.plantingDate);
  const kcNote=a.ndviStale?(crop.stage_curve&&crop.planting_date?' '+T('kcStage'):' '+T('kcGeneral')):'';
  $('advice').innerHTML=
   `<div class="big ${cls}"><div class="t">${esc(f.name)} · ${fmt(f.areaM2/10000,2)} ha · ${esc(T('crop_'+(f.cropId||'general')))}</div><div class="h">${esc(head)}</div><div class="r">${esc(T(a.reasonKey,a.rp))}</div>${how}</div>`+warnHtml+
   `<div class="card"><h2>${esc(T('soilWater'))} <span class="pill">${esc(T('estimate'))}</span></h2><div class="bar"><i style="width:${Math.min(100,a.pct).toFixed(0)}%"></i><b style="left:${(100*a.raw/a.taw).toFixed(0)}%"></b></div>
     <div class="note">${esc(T('used',{dr:fmt(a.dr),taw:fmt(a.taw),raw:fmt(a.raw)}))}</div></div>`+
   `<div class="card"><h2>${esc(T('nextDays'))}</h2><div class="fc">${fc}</div></div>`+
   `<div class="card"><h2>${esc(T('ndviMapTitle'))}</h2><div id="ndviMapBox"></div>
      <div class="leg"></div><div class="legl"><span>−0.2 ${esc(T('ndviLow'))}</span><span>0.3</span><span>0.8 ${esc(T('ndviHigh'))}</span></div>
      <div class="note" style="margin-top:6px"><span class="sw" style="background:#9aa0a6"></span>${esc(T('ndviCloud'))} &nbsp; <span class="sw" style="background:rgba(120,180,120,.35)"></span>${esc(T('ndviEdge'))}</div>
      <div class="chips" id="ndviDates"></div><p class="note" id="ndviNote"></p></div>`+
   `<div class="card"><h2>${esc(T('basedOn'))}</h2><div class="kv">
      <span>${esc(T('kCrop'))}</span><span>${esc(T('crop_'+(f.cropId||'general')))}</span>
      <span>${esc(T('kKc'))}</span><span>${a.kc!=null?fmt(a.kc,2):'—'}${esc(kcNote)}</span>
      <span>${esc(T('kNdvi'))}</span><span>${a.ndvi!=null?fmt(a.ndvi,2):'—'}${nd?` · ${nd.date}`:''}</span>
      <span>${esc(T('kPixels'))}</span><span>${nd?esc(T('pixels',{n:nd.n})+(nd.shrunk?T('edges'):'')):'—'}</span>
      <span>${esc(T('kSoil'))}</span><span>${a.soil&&a.soil.clay!=null?esc(T('soilVal',{clay:fmt(a.soil.clay*100),sand:fmt(a.soil.sand*100)})):esc(T('soilGeneral'))}</span>
      <span>${esc(T('kRain2'))}</span><span>${fmt(a.forecastRain2d,0)} mm</span></div>
      <p class="note">${esc(T('srcNote'))}</p></div>`;
  drawNdvi(f);
  $('logCard').hidden=false;$('mgmt').hidden=false;
  $('logNote').textContent=f.events.length?T('logNoteN',{n:f.events.length}):T('logNote0');
}

// ── farmer log (V4) ──
function addEvent(type,val){const f=farm();f.events.push({date:today(),type,value:val});save();refreshFarm(false);}
$('btnIrr').onclick=()=>{
  const f=farm();
  if(f.flowLph){const m=parseFloat(prompt(T('pMinutes'),'60'));if(m>0&&m<2000)addEvent('irrigation_mm',(m/60*f.flowLph)/f.areaM2*0.88);}
  else{const v=parseFloat(prompt(T('pMm'),'10'));if(v>0&&v<300)addEvent('irrigation_mm',v);}
};
$('btnRain').onclick=()=>{const v=parseFloat(prompt(T('pRain'),'10'));if(v>0&&v<400)addEvent('rain_mm',v);};
$('btnFull').onclick=()=>{if(confirm(T('cFull'))){const f=farm();f.start={date:today(),frac:0};save();refreshFarm(false);}};

// boot
window.AgriApp={_map:()=>map,_state:()=>({pts,pin}),db:()=>db,lang:()=>lang,setLang,refreshFarm,renderHome,openFarm,renderAdvice};
applyStatic();
if(db.farms.length===1&&db.selected&&!needConsent())openFarm(db.selected);else renderHome();
})();
</script>
